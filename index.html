<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PicSong</title>
  <meta name="description" content="Drop a picture. PicSong mashes a soundboard at it for two and a half to five seconds. The original photo is deleted. Always back up your photos. It cannot turn music into a photo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efe6d2'/%3E%3Ccircle cx='11' cy='12' r='4' fill='%231c140c'/%3E%3Crect x='5' y='22' width='22' height='4' fill='%23c7372a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="shell">
    <header class="mast">
      <h1 class="brand">
        <img src="images/picsong-wordmark.png" alt="PicSong" width="1161" height="397">
      </h1>
      <p class="dek">The first program that turns your photos into music.</p>
    </header>

    <div class="stage" id="stage">
      <input class="file" id="file" type="file" accept="image/*">
      <label class="drop" id="drop" for="file">
        <span class="empty" id="empty">
          <span class="drop-title">Drop a picture here</span>
          <span class="drop-hint">or choose a file.</span>
        </span>
        <span class="photo" id="photo" hidden>
          <img id="preview" alt="">
        </span>
      </label>
      <div class="song" id="song" hidden>
        <button class="wave-play" id="play" type="button" aria-label="Play the sound">
          <span class="play-face" aria-hidden="true"></span>
          <svg class="wave" viewBox="0 0 468 142" aria-hidden="true">
            <g fill="#fd9810">
              <g class="bars">
                <rect class="bar" x="4" y="74" width="28" height="34" rx="14" style="--d:0.46s;--delay:0s"/>
                <rect class="bar" x="52" y="12" width="28" height="96" rx="14" style="--d:0.34s;--delay:0.08s"/>
                <rect class="bar" x="100" y="44" width="28" height="64" rx="14" style="--d:0.52s;--delay:0.03s"/>
                <rect class="bar" x="148" y="41" width="28" height="67" rx="14" style="--d:0.38s;--delay:0.12s"/>
                <rect class="bar" x="196" y="48" width="28" height="60" rx="14" style="--d:0.44s;--delay:0.05s"/>
                <rect class="bar" x="244" y="46" width="28" height="62" rx="14" style="--d:0.32s;--delay:0.16s"/>
                <rect class="bar" x="292" y="70" width="28" height="38" rx="14" style="--d:0.5s;--delay:0.02s"/>
                <rect class="bar" x="340" y="64" width="28" height="44" rx="14" style="--d:0.36s;--delay:0.1s"/>
                <rect class="bar" x="388" y="64" width="28" height="44" rx="14" style="--d:0.48s;--delay:0.06s"/>
                <rect class="bar" x="436" y="67" width="28" height="41" rx="14" style="--d:0.4s;--delay:0.14s"/>
              </g>
              <g class="echo">
                <rect class="tick" x="8" y="118" width="4" height="10" rx="1.5" style="--d:0.46s;--delay:0s"/>
                <rect class="tick" x="16" y="118" width="4" height="16" rx="1.5" style="--d:0.46s;--delay:0s"/>
                <rect class="tick" x="24" y="118" width="4" height="8" rx="1.5" style="--d:0.46s;--delay:0s"/>
                <rect class="tick" x="56" y="118" width="4" height="10" rx="1.5" style="--d:0.34s;--delay:0.08s"/>
                <rect class="tick" x="64" y="118" width="4" height="16" rx="1.5" style="--d:0.34s;--delay:0.08s"/>
                <rect class="tick" x="72" y="118" width="4" height="8" rx="1.5" style="--d:0.34s;--delay:0.08s"/>
                <rect class="tick" x="104" y="118" width="4" height="10" rx="1.5" style="--d:0.52s;--delay:0.03s"/>
                <rect class="tick" x="112" y="118" width="4" height="16" rx="1.5" style="--d:0.52s;--delay:0.03s"/>
                <rect class="tick" x="120" y="118" width="4" height="8" rx="1.5" style="--d:0.52s;--delay:0.03s"/>
                <rect class="tick" x="152" y="118" width="4" height="10" rx="1.5" style="--d:0.38s;--delay:0.12s"/>
                <rect class="tick" x="160" y="118" width="4" height="16" rx="1.5" style="--d:0.38s;--delay:0.12s"/>
                <rect class="tick" x="168" y="118" width="4" height="8" rx="1.5" style="--d:0.38s;--delay:0.12s"/>
                <rect class="tick" x="200" y="118" width="4" height="10" rx="1.5" style="--d:0.44s;--delay:0.05s"/>
                <rect class="tick" x="208" y="118" width="4" height="16" rx="1.5" style="--d:0.44s;--delay:0.05s"/>
                <rect class="tick" x="216" y="118" width="4" height="8" rx="1.5" style="--d:0.44s;--delay:0.05s"/>
                <rect class="tick" x="248" y="118" width="4" height="10" rx="1.5" style="--d:0.32s;--delay:0.16s"/>
                <rect class="tick" x="256" y="118" width="4" height="16" rx="1.5" style="--d:0.32s;--delay:0.16s"/>
                <rect class="tick" x="264" y="118" width="4" height="8" rx="1.5" style="--d:0.32s;--delay:0.16s"/>
                <rect class="tick" x="296" y="118" width="4" height="10" rx="1.5" style="--d:0.5s;--delay:0.02s"/>
                <rect class="tick" x="304" y="118" width="4" height="16" rx="1.5" style="--d:0.5s;--delay:0.02s"/>
                <rect class="tick" x="312" y="118" width="4" height="8" rx="1.5" style="--d:0.5s;--delay:0.02s"/>
                <rect class="tick" x="344" y="118" width="4" height="10" rx="1.5" style="--d:0.36s;--delay:0.1s"/>
                <rect class="tick" x="352" y="118" width="4" height="16" rx="1.5" style="--d:0.36s;--delay:0.1s"/>
                <rect class="tick" x="360" y="118" width="4" height="8" rx="1.5" style="--d:0.36s;--delay:0.1s"/>
                <rect class="tick" x="392" y="118" width="4" height="10" rx="1.5" style="--d:0.48s;--delay:0.06s"/>
                <rect class="tick" x="400" y="118" width="4" height="16" rx="1.5" style="--d:0.48s;--delay:0.06s"/>
                <rect class="tick" x="408" y="118" width="4" height="8" rx="1.5" style="--d:0.48s;--delay:0.06s"/>
                <rect class="tick" x="440" y="118" width="4" height="10" rx="1.5" style="--d:0.4s;--delay:0.14s"/>
                <rect class="tick" x="448" y="118" width="4" height="16" rx="1.5" style="--d:0.4s;--delay:0.14s"/>
                <rect class="tick" x="456" y="118" width="4" height="8" rx="1.5" style="--d:0.4s;--delay:0.14s"/>
              </g>
            </g>
          </svg>
          <span class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="How far along the sound is">
            <span class="progress-fill" id="progress-fill"></span>
          </span>
        </button>
      </div>
    </div>

    <div class="actions">
      <button class="convert" id="convert" type="button" hidden>Convert to sound</button>
      <button class="download" id="download" type="button" hidden>Download the WAV</button>
      <button class="again" id="again" type="button" hidden>Choose another picture</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <footer class="foot">
      <p>Do you get to keep the original photo? No, it gets deleted. Always back up your photos before using PicSong.</p>
    </footer>
  </main>
  <noscript>
    <p>PicSong needs JavaScript to mash the soundboard. Nothing is uploaded. Always back up your photos before using PicSong. The original gets deleted.</p>
  </noscript>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
